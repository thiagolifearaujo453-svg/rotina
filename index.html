<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#070710" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Rotina" />
  <meta name="description" content="Seu app diario de rotina, disciplina e produtividade" />
  <title>Rotina ✦</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
</head>
<body class="dark">
  <div id="app">
    <div id="screen-onboarding" class="screen active">
      <div class="onboarding-wrap">
        <div id="ob-step" class="ob-step"></div>
        <div class="ob-dots" id="ob-dots"></div>
        <div class="ob-actions">
          <button class="btn-ghost" id="ob-back">Voltar</button>
          <button class="btn-primary" id="ob-next">Próximo</button>
        </div>
      </div>
    </div>
    <div id="screen-app" class="screen">
      <div id="main-content"></div>
      <nav class="bottom-nav" id="bottom-nav">
        <button class="nav-btn" data-screen="home" onclick="navigate('home')">
          <span class="nav-icon">🏠</span>
          <span class="nav-label">Início</span>
        </button>
        <button class="nav-btn" data-screen="checklist" onclick="navigate('checklist')">
          <span class="nav-icon">✅</span>
          <span class="nav-label">Hoje</span>
        </button>
        <button class="nav-btn" data-screen="habits" onclick="navigate('habits')">
          <span class="nav-icon">🔥</span>
          <span class="nav-label">Hábitos</span>
        </button>
        <button class="nav-btn" id="btn-mais" onclick="toggleMore()">
          <span class="nav-icon">☰</span>
          <span class="nav-label">Mais</span>
        </button>
      </nav>
      <div id="more-overlay" class="more-overlay hidden" onclick="toggleMore()"></div>
      <div id="more-popup" class="more-popup hidden">
        <div class="more-popup-header">
          <span class="more-popup-title">Módulos</span>
          <button onclick="toggleMore()" class="more-close">✕</button>
        </div>
        <div class="more-grid">
          <button onclick="navigate('study');toggleMore()" class="more-item">📚<span>Estudos</span></button>
          <button onclick="navigate('health');toggleMore()" class="more-item">💪<span>Treino</span></button>
          <button onclick="navigate('mental');toggleMore()" class="more-item">🧠<span>Mental</span></button>
          <button onclick="navigate('weekly');toggleMore()" class="more-item">📅<span>Semana</span></button>
          <button onclick="navigate('reports');toggleMore()" class="more-item">📊<span>Relatórios</span></button>
          <button onclick="navigate('achievements');toggleMore()" class="more-item">🏆<span>Conquistas</span></button>
          <button onclick="navigate('minimal');toggleMore()" class="more-item">🌙<span>Dia difícil</span></button>
          <button onclick="navigate('settings');toggleMore()" class="more-item">⚙️<span>Config</span></button>
        </div>
      </div>
    </div>
  </div>
  <div id="toast-container"></div>
  <div id="xp-flash" class="xp-flash hidden"></div>
  <script src="app.js"></script>
</body>
</html>
